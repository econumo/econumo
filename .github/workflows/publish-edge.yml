name: Publish Edge

# Publishes every push to main as the "edge" channel, the early preview that
# production runs before a release: the ghcr.io/econumo/econumo:edge image
# plus the edge channel of the linux binaries in the private R2 bucket (ship).
# No git tag, no immutable R2 version, no GitHub release.
#
# An edge build reports the highest release tag as its version (v1.8.0 for
# every build between the v1.8.0 and v1.8.1 releases). That is a plain vX.Y.Z,
# so the "What's new" card, the update notice and new-account version seeding
# behave exactly as on that release: the card for a line appears once a
# release of it is cut, never before, and stays until each user dismisses it.
# Builds stay distinguishable by their commit (VERSION_REF), which also keys
# the client caches. A release that moves "latest" moves "edge" too
# (publish-release.yml).
#
# A release cut while a build runs would leave that build stamped with the
# previous version; it re-reads the tags before moving "edge" and stands down
# when a newer release exists (the release has already moved "edge").

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "publish-edge"
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/econumo/econumo

jobs:
  resolve:
    name: Resolve Commit and Version
    # A manual run dispatched from another branch must not put that branch on
    # production; Publish Dev is the channel for testing branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Test the release-tag helper
        run: sh .github/scripts/highest-release-tag_test.sh

      # All tags, not only ancestors of main: a hotfix released from a
      # release/* branch counts. `dev` when the repository has no release.
      - name: Resolve
        id: resolve
        run: |
          SHA="$(git rev-parse HEAD)"
          VERSION="$(git ls-remote --tags --refs origin | sh .github/scripts/highest-release-tag.sh)"
          VERSION="${VERSION:-dev}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing edge from ${SHA} as ${VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

  publish-image:
    name: Build and Publish Edge Image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # No QEMU: both build stages run on $BUILDPLATFORM (Go cross-compiles,
      # the SPA is platform-independent) and the distroless stage only COPYs.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only: the edge tag moves in the next step, after the
      # release re-check.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/Dockerfile
          target: prod
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ECONUMO_VERSION=${{ needs.resolve.outputs.version }}
            ECONUMO_COMMIT=${{ needs.resolve.outputs.sha }}

      - name: Move the edge tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          NOW="$(git ls-remote --tags --refs origin | sh .github/scripts/highest-release-tag.sh)"
          if [ "${NOW:-dev}" != "$VERSION" ]; then
            echo "::notice::Release ${NOW} was cut during this ${VERSION} build; it has moved edge, leaving it alone."
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE}:edge" "${IMAGE}@${DIGEST}"

  publish-binaries:
    name: Build and Publish Edge Binaries
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # The SPA build lands in web/dist, where web/embed.go embeds it into the
      # Go binaries below.
      - name: Build SPA
        env:
          ECONUMO_VERSION: ${{ needs.resolve.outputs.version }}
          ECONUMO_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          npm install -g pnpm@11
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          mkdir -p release-out
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X github.com/econumo/econumo/internal/version.Version=${VERSION} -X github.com/econumo/econumo/internal/version.Commit=${COMMIT}" \
              -o "release-out/econumo-linux-${arch}" ./cmd/econumo
          done

      - name: Set up ship
        uses: dmtrkzntsv/ship@v0

      # The channel only (the Makefile's default VERSION=dev publishes no
      # immutable version), so edge builds never count against the versions
      # ship keeps.
      - name: Publish edge channel to R2
        env:
          SHIP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SHIP_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          SHIP_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          NOW="$(git ls-remote --tags --refs origin | sh .github/scripts/highest-release-tag.sh)"
          if [ "${NOW:-dev}" != "$VERSION" ]; then
            echo "::notice::Release ${NOW} was cut during this ${VERSION} build; it has moved edge, leaving it alone."
            exit 0
          fi
          make ship-dist SHIP_SKIP_BUILD=1
          make ship-publish CHANNELS=edge
